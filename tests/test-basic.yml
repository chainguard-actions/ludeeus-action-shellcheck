name: Test basic ShellCheck usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          scandir: ${{ github.workspace }}/tests/fixtures/basic
          severity: error

      - name: Assert options output is set
        env:
          OPTIONS: ${{ steps.action.outputs.options }}
        run: |
          echo "options: $OPTIONS"
          if [ -z "$OPTIONS" ]; then
            echo "FAIL: options output should not be empty"
            exit 1
          fi
          echo "PASS: options output is set"

      - name: Assert files output is set
        env:
          FILES: ${{ steps.action.outputs.files }}
        run: |
          echo "files: $FILES"
          if [ -z "$FILES" ]; then
            echo "FAIL: files output should not be empty (expected to find good.sh)"
            exit 1
          fi
          echo "PASS: files output is set"
