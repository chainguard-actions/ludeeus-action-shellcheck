name: Test ShellCheck ignore_names input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          scandir: ${{ github.workspace }}/tests/fixtures/ignore-names
          ignore_names: skip_me.sh
          severity: error

      - name: Assert action succeeded (skip_me.sh was excluded)
        run: |
          echo "PASS: action completed without error (skip_me.sh was excluded)"

      - name: Assert files output does not contain ignored name
        env:
          FILES: ${{ steps.action.outputs.files }}
        run: |
          echo "files: $FILES"
          if echo "$FILES" | grep -q "skip_me.sh"; then
            echo "FAIL: files output should not contain skip_me.sh"
            exit 1
          fi
          echo "PASS: skip_me.sh is not in files output"

      - name: Assert good.sh is in files output
        env:
          FILES: ${{ steps.action.outputs.files }}
        run: |
          echo "files: $FILES"
          if echo "$FILES" | grep -q "good.sh"; then
            echo "PASS: good.sh is in files output"
          else
            echo "FAIL: expected good.sh in files output"
            exit 1
          fi
