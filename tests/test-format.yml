name: Test ShellCheck format input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          scandir: ${{ github.workspace }}/tests/fixtures/format
          format: json

      - name: Assert options output contains json format
        env:
          OPTIONS: ${{ steps.action.outputs.options }}
        run: |
          echo "options: $OPTIONS"
          if [ -z "$OPTIONS" ]; then
            echo "FAIL: options output should not be empty"
            exit 1
          fi
          if echo "$OPTIONS" | grep -q "format=json"; then
            echo "PASS: format=json is present in options"
          else
            echo "FAIL: expected 'format=json' in options, got: $OPTIONS"
            exit 1
          fi

      - name: Assert files output is set
        env:
          FILES: ${{ steps.action.outputs.files }}
        run: |
          echo "files: $FILES"
          if [ -z "$FILES" ]; then
            echo "FAIL: files output should not be empty"
            exit 1
          fi
          echo "PASS: files output is set"
