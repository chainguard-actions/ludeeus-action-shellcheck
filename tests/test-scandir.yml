name: Test ShellCheck scandir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          scandir: ${{ github.workspace }}/tests/fixtures/scandir

      - name: Assert files output contains files from scandir
        env:
          FILES: ${{ steps.action.outputs.files }}
        run: |
          echo "files: $FILES"
          if [ -z "$FILES" ]; then
            echo "FAIL: files output should not be empty when scanning fixtures/scandir"
            exit 1
          fi
          echo "PASS: files output is set"

      - name: Assert options output is set
        env:
          OPTIONS: ${{ steps.action.outputs.options }}
        run: |
          echo "options: $OPTIONS"
          if [ -z "$OPTIONS" ]; then
            echo "FAIL: options output should not be empty"
            exit 1
          fi
          # Default format is gcc
          if echo "$OPTIONS" | grep -q "format=gcc"; then
            echo "PASS: default format=gcc is present in options"
          else
            echo "FAIL: expected format=gcc in options, got: $OPTIONS"
            exit 1
          fi
