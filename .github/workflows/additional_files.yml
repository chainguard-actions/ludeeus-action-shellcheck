name: 'additional_files'

on: 
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"

permissions: {}

jobs:
  additional_files:
    name: additional_files
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

    - name: Run ShellCheck
      uses: ./
      id: check
      with:
        additional_files: run finish discovery
        ignore_paths: ignore
        scandir: testfiles

    - name: Verify check
      env:
        CHECK_FILES: ${{ steps.check.outputs.files }}
      run: | 
        expect="testfiles/scandir/run"

        if [[ ! "$CHECK_FILES" =~ testfiles/scandir/run ]];then
          echo "::error:: Expected file testfiles/scandir/run not found in $CHECK_FILES"
          exit 1
        elif [[ ! "$CHECK_FILES" =~ testfiles/scandir/finish ]];then
          echo "::error:: Expected file testfiles/scandir/finish not found in $CHECK_FILES"
          exit 1
        elif [[ ! "$CHECK_FILES" =~ testfiles/scandir/discovery ]];then
          echo "::error:: Expected file testfiles/scandir/discovery not found in $CHECK_FILES"
          exit 1
        fi 