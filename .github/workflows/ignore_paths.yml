name: "ignore_paths"

on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"

permissions: {}

jobs:
  ignore_paths:
    name: ignore_paths
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Run ShellCheck
        uses: ./
        id: check
        with:
          ignore_paths: ignore ./testfiles/ignore_some/duplicate_name.bash **/ignore_some/ignore.bash

      - name: Verify check
        env:
          CHECK_FILES: ${{ steps.check.outputs.files }}
        run: |
          fail=false

          # verify a non-ignored path is not excluded
          expect="testfiles/test.bash"
          if [[ ! "$CHECK_FILES" =~ $expect ]];then
            echo "::error:: Expected file $expect not found in $CHECK_FILES"
            fail=true
          fi

          # verify a file with the same name as an ignored file but at a
          # different path is not excluded
          expect="testfiles/duplicate_name.bash"
          if [[ ! "$CHECK_FILES" =~ $expect ]];then
            echo "::error:: Expected file $expect not found in $CHECK_FILES"
            fail=true
          fi

          # verify ignored full path excluded
          notexpect="testfiles/ignore_some/duplicate_name.bash"
          if [[ "$CHECK_FILES" =~ $notexpect ]];then
            echo "::error:: Unexpected file $notexpect found in $CHECK_FILES"
            fail=true
          fi

          # verify ignored directory excluded
          notexpect="testfiles/ignore/ignore.bash"
          if [[ "$CHECK_FILES" =~ $notexpect ]];then
            echo "::error:: Unexpected file $notexpect found in $CHECK_FILES"
            fail=true
          fi

          # verify ignored glob excluded
          notexpect="testfiles/ignore_some/ignore.bash"
          if [[ "$CHECK_FILES" =~ $notexpect ]];then
            echo "::error:: Unexpected file $notexpect found in $CHECK_FILES"
            fail=true
          fi

          if $fail;then
            exit 1
          fi
