name: "ShellCheck"
author: "Ludeeus <hi@ludeeus.dev>"
description: "GitHub action for ShellCheck."
inputs:
  additional_files:
    description: "A space separated list of additional filename to check"
    required: false
    default: ""
  ignore:
    description: "Paths to ignore when running ShellCheck"
    required: false
    default: ""
    deprecationMessage: "Use ignore_paths or ignore_names instead."
  ignore_paths:
    description: "Paths to ignore when running ShellCheck"
    required: false
    default: ""
  ignore_names:
    description: "Names to ignore when running ShellCheck"
    required: false
    default: ""
  severity:
    description: "Minimum severity of errors to consider. Options: [error, warning, info, style]"
    required: false
    default: ""
  check_together:
    description: "Run shellcheck on _all_ files at once, instead of one at a time"
    required: false
    default: ""
  scandir:
    description: "Directory to be searched for files. Defaults to ."
    required: false
    default: "."
  disable_matcher:
    description: "Set to true to skip using problem-matcher"
    required: false
    default: "false"
    deprecationMessage: "There are no problem-matchers, this setting does not do anything."
  format:
    description: "Output format (checkstyle, diff, gcc, json, json1, quiet, tty)"
    required: false
    default: "gcc"
  version:
    description: "Specify a concrete version of ShellCheck to use"
    required: false
    default: "stable"
outputs:
  files:
    description: A list of files with issues
    value: ${{ steps.check.outputs.filepaths }}
  options:
    description: The options used
    value: ${{ steps.options.outputs.options }}
branding:
  icon: "terminal"
  color: "gray-dark"
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Download shellcheck
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        RUNNER_OS: ${{ runner.os }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        if [[ "${RUNNER_OS}" == "macOS" ]]; then
          osvariant="darwin"
        else
          osvariant="linux"
        fi

        baseurl="https://github.com/koalaman/shellcheck/releases/download"

        curl -Lso "${ACTION_PATH}/sc.tar.xz" \
          "${baseurl}/${INPUT_VERSION}/shellcheck-${INPUT_VERSION}.${osvariant}.x86_64.tar.xz"

        tar -xf "${ACTION_PATH}/sc.tar.xz" -C "${ACTION_PATH}"
        mv "${ACTION_PATH}/shellcheck-${INPUT_VERSION}/shellcheck" \
          "${ACTION_PATH}/shellcheck"
    - name: Display shellcheck version
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        "${ACTION_PATH}/shellcheck" --version
    - name: Set options
      shell: bash
      id: options
      env:
        INPUT_SEVERITY: ${{ inputs.severity }}
        INPUT_FORMAT: ${{ inputs.format }}
      run: |
        declare -a options
        if [[ -n "${INPUT_SEVERITY}" ]]; then
          options+=("-S ${INPUT_SEVERITY}")
        fi
        options+=("--format=${INPUT_FORMAT}")
        safe_options=$(printf '%s' "${options[*]}" | tr -d '\n\r')
        echo "options=${safe_options}" >> "$GITHUB_OUTPUT"
    - name: Gather excluded paths
      shell: bash
      id: exclude
      env:
        INPUT_IGNORE: ${{ inputs.ignore }}
        INPUT_IGNORE_PATHS: ${{ inputs.ignore_paths }}
        INPUT_IGNORE_NAMES: ${{ inputs.ignore_names }}
      run: |
        declare -a excludes
        set -f # temporarily disable globbing so that globs in input aren't expanded

        excludes+=("! -path *./.git/*")
        excludes+=("! -path *.go")
        excludes+=("! -path */mvnw")
        if [[ -n "${INPUT_IGNORE}" ]]; then
          while IFS= read -r -d '' token; do
            excludes+=("! -path *./$token/*")
            excludes+=("! -path */$token/*")
            excludes+=("! -path $token")
          done < <(printf '%s' "${INPUT_IGNORE}" | xargs printf '%s\0')
        else
          if [[ -n "${INPUT_IGNORE_PATHS}" ]]; then
            while IFS= read -r -d '' token; do
              excludes+=("! -path *./$token/*")
              excludes+=("! -path */$token/*")
              excludes+=("! -path $token")
            done < <(printf '%s' "${INPUT_IGNORE_PATHS}" | xargs printf '%s\0')
          fi
        fi

        if [[ -n "${INPUT_IGNORE_NAMES}" ]]; then
          while IFS= read -r -d '' token; do
            excludes+=("! -name $token")
          done < <(printf '%s' "${INPUT_IGNORE_NAMES}" | xargs printf '%s\0')
        fi
        safe_excludes=$(printf '%s' "${excludes[*]}" | tr -d '\n\r')
        echo "excludes=${safe_excludes}" >> "$GITHUB_OUTPUT"

        set +f # re-enable globbing
    - name: Gather additional files
      shell: bash
      id: additional
      env:
        INPUT_ADDITIONAL_FILES: ${{ inputs.additional_files }}
      run: |
        declare -a files
        if [[ -n "${INPUT_ADDITIONAL_FILES}" ]]; then
          while IFS= read -r -d '' token; do
            files+=("-o -name *$token")
          done < <(printf '%s' "${INPUT_ADDITIONAL_FILES}" | xargs printf '%s\0')
        fi
        safe_files=$(printf '%s' "${files[*]}" | tr -d '\n\r')
        echo "files=${safe_files}" >> "$GITHUB_OUTPUT"
    - name: Run the check
      shell: bash
      id: check
      env:
        INPUT_SCANDIR: ${{ inputs.scandir }}
        INPUT_CHECK_TOGETHER: ${{ inputs.check_together }}
        INPUT_EXCLUDE_ARGS: ${{ steps.exclude.outputs.excludes }}
        INPUT_ADDITIONAL_FILE_ARGS: ${{ steps.additional.outputs.files }}
        INPUT_SHELLCHECK_OPTIONS: ${{ steps.options.outputs.options }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        statuscode=0
        declare -a filepaths
        declare -a exclude_args
        declare -a additional_file_args
        declare -a shellcheck_options
        shebangregex="^#! */[^ ]*/(env *)?[abk]*sh"

        set -f # temporarily disable globbing so that globs in inputs aren't expanded

        if [[ -n "${INPUT_EXCLUDE_ARGS}" ]]; then
          while IFS= read -r -d '' t; do exclude_args+=("$t"); done \
            < <(printf '%s' "${INPUT_EXCLUDE_ARGS}" | xargs printf '%s\0')
        fi

        if [[ -n "${INPUT_ADDITIONAL_FILE_ARGS}" ]]; then
          while IFS= read -r -d '' t; do additional_file_args+=("$t"); done \
            < <(printf '%s' "${INPUT_ADDITIONAL_FILE_ARGS}" | xargs printf '%s\0')
        fi

        if [[ -n "${INPUT_SHELLCHECK_OPTIONS}" ]]; then
          while IFS= read -r -d '' t; do shellcheck_options+=("$t"); done \
            < <(printf '%s' "${INPUT_SHELLCHECK_OPTIONS}" | xargs printf '%s\0')
        fi

        while IFS= read -r -d '' file; do
          filepaths+=("$file")
        done < <(find "${INPUT_SCANDIR}" \
            "${exclude_args[@]}" \
            -type f \
            '(' \
            -name '*.bash' \
            -o -name '.bashrc' \
            -o -name 'bashrc' \
            -o -name '.bash_aliases' \
            -o -name '.bash_completion' \
            -o -name '.bash_login' \
            -o -name '.bash_logout' \
            -o -name '.bash_profile' \
            -o -name 'bash_profile' \
            -o -name '*.ksh' \
            -o -name 'suid_profile' \
            -o -name '*.zsh' \
            -o -name '.zlogin' \
            -o -name 'zlogin' \
            -o -name '.zlogout' \
            -o -name 'zlogout' \
            -o -name '.zprofile' \
            -o -name 'zprofile' \
            -o -name '.zsenv' \
            -o -name 'zsenv' \
            -o -name '.zshrc' \
            -o -name 'zshrc' \
            -o -name '*.sh' \
            -o -path '*/.profile' \
            -o -path '*/profile' \
            -o -name '*.shlib' \
            "${additional_file_args[@]}" \
            ')' \
            -print0)

        while IFS= read -r -d '' file; do
          head -n1 "$file" | grep -Eqs "$shebangregex" || continue
          filepaths+=("$file")
        done < <(find "${INPUT_SCANDIR}" \
            "${exclude_args[@]}" \
            -type f ! -name '*.*' -perm /111 \
            -print0)

        if [[ -n "${INPUT_CHECK_TOGETHER}" ]]; then
          "${ACTION_PATH}/shellcheck" \
            "${shellcheck_options[@]}" \
            "${filepaths[@]}" || statuscode=$?
        else
          for file in "${filepaths[@]}"; do
            "${ACTION_PATH}/shellcheck" \
              "${shellcheck_options[@]}" \
              "$file" || statuscode=$?
          done
        fi

        safe_filepaths=$(printf '%s' "${filepaths[*]}" | tr -d '\n\r')
        echo "filepaths=${safe_filepaths}" >> "$GITHUB_OUTPUT"
        echo "statuscode=$statuscode" >> "$GITHUB_OUTPUT"

        set +f # re-enable globbing
    - name: Exit action
      shell: bash
      env:
        STATUSCODE: ${{ steps.check.outputs.statuscode }}
      run: exit "${STATUSCODE}"
